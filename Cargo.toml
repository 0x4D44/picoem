[workspace]
members = ["crates/*"]
# epio-sys requires clang and vendored submodules. Excluded from
# default-members so `cargo build` at the root keeps working on hosts
# without clang. Build it explicitly: `cargo build -p epio-sys`.
default-members = [
    "crates/mdpicoem-common",
    "crates/mdpicoem-debug",
    "crates/mdpicoem-devices",
    "crates/mdpicoem-harness",
    "crates/mdrp2040",
    "crates/mdrp2040app",
    "crates/mdrp2350",
    "crates/mdrp2350app",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"

[profile.release.package.mdrp2350]
codegen-units = 1

[profile.release.package.mdrp2040]
codegen-units = 1

# Release build with line-tables for profiling (samply, perf, VTune).
# Inherits all release optimizations. Full debug info ("debug = true")
# would inhibit inlining; line-tables-only keeps profiler symbols without
# affecting code generation.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
lto = false

# Routes probe-rs through a small in-tree fork carrying the (V2, DPv1)
# cache-upgrade workaround for upstream issue #3872. Drop this block
# once probe-rs ships a fix and we can bump to the released version.
# See wrk_docs/2026.04.21 - HLD - Track A Probe-rs Attach Fix.md.
[patch.crates-io]
probe-rs = { path = "third_party/probe-rs-0.31.0-mdrp-patched" }

