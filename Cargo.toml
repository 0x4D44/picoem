[workspace]
members = ["crates/*"]
# epio-sys requires clang and vendored submodules. Excluded from
# default-members so `cargo build` at the root keeps working on hosts
# without clang. Build it explicitly: `cargo build -p epio-sys`.
default-members = [
    "crates/mdpicoem-common",
    "crates/mdpicoem-debug",
    "crates/mdpicoem-harness",
    "crates/mdrp2040",
    "crates/mdrp2040app",
    "crates/mdrp2350",
    "crates/mdrp2350app",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"

[profile.release.package.mdrp2350]
codegen-units = 1

[profile.release.package.mdrp2040]
codegen-units = 1

# Release build with line-tables for profiling (samply, perf, VTune).
# Inherits all release optimizations. Full debug info ("debug = true")
# would inhibit inlining; line-tables-only keeps profiler symbols without
# affecting code generation.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
lto = false

