[workspace]
members = ["crates/*"]
# epio-sys requires clang and vendored submodules. Excluded from
# default-members so `cargo build` at the root keeps working on hosts
# without clang. Build it explicitly: `cargo build -p epio-sys`.
default-members = [
    "crates/picoem-common",
    "crates/picoem-debug",
    "crates/picoem-devices",
    "crates/picoem-harness",
    "crates/rp2040-emu",
    "crates/rp2040-emu-tui",
    "crates/rp2350-emu",
    "crates/rp2350-emu-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Plain `tracing` here — the `release_max_level_info` cap is binary-only
# (per tracing's own docs) because Cargo unifies features across the dep
# graph. If a library crate enables the cap, every downstream consumer
# inherits it and their own `debug!`/`trace!` calls get compiled out in
# release without their consent. The cap is added on each binary-producing
# crate (picoem-harness, rp2350-emu-tui, rp2040-emu-tui) instead; feature
# unification still propagates it down to our libraries when they're built
# into our binaries, so the in-workspace perf benefit is preserved.
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
# Bit-field literals deliberately group by ARM/RISC-V ISA encoding
# fields (e.g. `0b11110_0_111000_0000u16` = wide-prefix | S | op | Rn).
# Reformatting to 4-bit groups destroys the ISA-encoding visibility.
unusual_byte_groupings = "allow"

# Emulator code routinely iterates by index where `i` is itself the
# semantic value: register number 0..16, NVIC line 0..240, GPIO pad
# 0..30, core ID 0..2. Explicit indexing reads more naturally than
# `.iter().enumerate()` in those contexts and matches the hardware
# documentation.
needless_range_loop = "allow"

# Cortex-M / coprocessor / GDB-stub handler signatures naturally
# carry 8+ arguments (cpu, bus, opcode fields, encoding flags...).
# Bundling into structs hides the protocol.
too_many_arguments = "allow"

# Tuple-and-fn-pointer types in test scaffolding and callback
# registries are dense by design; aliasing them out hides the shape.
type_complexity = "allow"

# `Cores::Arm([CortexM33; 2])` vs `Cores::RiscV([Hazard3; 2])` and the
# paced-bench `Runtime::Serial(Emulator)` are stack-allocated
# deliberately to keep the hot path off the heap.
large_enum_variant = "allow"

# ARMv8-M exception names (HardFault, UsageFault, MemFault) and
# RISC-V opcode classes (OpImm, OpReg) mirror the ISA spec; renaming
# would break the link to the architecture reference.
enum_variant_names = "allow"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"

[profile.release.package.rp2350-emu]
codegen-units = 1

[profile.release.package.rp2040-emu]
codegen-units = 1

# Release build with line-tables for profiling (samply, perf, VTune).
# Inherits all release optimizations. Full debug info ("debug = true")
# would inhibit inlining; line-tables-only keeps profiler symbols without
# affecting code generation.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
lto = false

# Routes probe-rs through a small in-tree fork carrying the (V2, DPv1)
# cache-upgrade workaround for upstream issue #3872. Drop this block
# once probe-rs ships a fix and we can bump to the released version.
# See wrk_docs/2026.04.21 - HLD - Track A Probe-rs Attach Fix.md.
[patch.crates-io]
probe-rs = { path = "third_party/probe-rs-0.31.0-mdrp-patched" }

