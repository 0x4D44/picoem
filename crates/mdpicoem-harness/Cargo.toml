[package]
name = "mdpicoem-harness"
version = "0.33.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
mdpicoem-common = { path = "../mdpicoem-common" }
mdpicoem-devices = { path = "../mdpicoem-devices" }
mdrp2350 = { path = "../mdrp2350" }
mdrp2040 = { path = "../mdrp2040" }
probe-rs = "0.31"
rand = "0.8"
chrono = "0.4"
ctrlc = "3"
humantime = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Windows-only: Job Object handles for kernel-enforced parent->child
# lifetime on QEMU children spawned by `QemuProcess`. Pinned to the same
# major version (0.61) already used transitively via probe-rs to avoid
# pulling a second copy.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

# Dev-only: re-declare `mdrp2350` with the `test-hooks` feature so
# unit tests can call `PioBlock::push_rx` for staging RX FIFO words
# (e.g. the end-to-end glue DMA chain test). Cargo unifies features
# across `[dependencies]` and `[dev-dependencies]` of the same crate,
# so this implicitly enables `mdpicoem-common/test-hooks` during tests.
[dev-dependencies]
mdrp2350 = { path = "../mdrp2350", features = ["test-hooks"] }
mdpicoem-common = { path = "../mdpicoem-common", features = ["test-hooks"] }
# External authoritative RISC-V decoder used by the `riscv_gen` property
# test (spec cross-check against our private encoder; see
# `wrk_docs/2026.04.17 - LLD - QEMU Diff RISC-V V1.md` §8). Exact-version
# pinned so upstream drift surfaces explicitly — upgrade review required.
riscv-decode = "=0.2.3"

# L1/L2/L3 integration tests for the QemuProcess child-cleanup path
# need `OpenProcess` / `WaitForSingleObject` / `TerminateProcess` to
# query and kill processes. Pinned to the same major already in the
# tree (see [target.cfg(windows).dependencies] above).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# L1 integration test on Unix uses `libc::kill(pid, 0)` to query liveness.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

