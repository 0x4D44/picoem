[package]
name = "mdrp2354-test-harness"
version = "0.10.0"
edition.workspace = true
license.workspace = true

[dependencies]
mdrp2354 = { path = "../mdrp2354" }
probe-rs = "0.31"
rand = "0.8"
chrono = "0.4"

[[bin]]
name = "qemu_diff"
path = "src/bin/qemu_diff.rs"

[[bin]]
name = "probe_verify"
path = "src/bin/probe_verify.rs"

[[bin]]
name = "probe_diff"
path = "src/bin/probe_diff.rs"

[[bin]]
name = "bank_conflict_test"
path = "src/bin/bank_conflict_test.rs"

[[bin]]
name = "full_test"
path = "src/bin/full_test.rs"
test = false

[[bin]]
name = "paced_bench"
path = "src/bin/paced_bench.rs"

[[bin]]
name = "softfloat_diff"
path = "src/bin/softfloat_diff.rs"
