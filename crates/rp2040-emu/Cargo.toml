[package]
name = "rp2040-emu"
version = "0.1.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cycle-accurate emulator for the Raspberry Pi RP2040 (dual Cortex-M0+ + PIO)."
repository = "https://github.com/0x4D44/picoem"
homepage = "https://github.com/0x4D44/picoem"
documentation = "https://docs.rs/rp2040-emu"
readme = "README.md"
keywords = ["emulator", "rp2040", "cortex-m0", "embedded", "pico"]
categories = ["emulators", "embedded"]

[lints]
workspace = true

[features]
# `threading` is opt-in for V1. The runtime supports x86_64 Windows
# and x86_64 Linux today (see the `cfg`-gates on
# `picoem_common::threaded` and `rp2040_emu::threaded::*`). On macOS or
# any non-x86_64 host the feature compiles but exposes no usable
# threaded entry points; defaulting it off keeps `cargo add rp2040-emu`
# working cross-platform out of the box. Windows / Linux users who
# want the threaded runtime should opt in: `cargo add rp2040-emu
# --features threading`.
default = []
# Forward the PIO `test-hooks` feature to `picoem-common`. Enables
# cross-crate unit tests to pop TX FIFO words via `PioBlock::pop_tx`
# and push RX FIFO words via `PioBlock::push_rx`.
test-hooks = ["picoem-common/test-hooks"]
# Dual-execution HLD V1 (Stage 3b.1): feature-gates the threaded
# runtime arriving in Stage 3b.2. Default on; disable for Serial-only
# builds on non-x86_64 targets. Stage 3b.1 ships the types only — the
# feature is a no-op until Stage 3b.2 lands the `threaded/` module.
threading = []
# Dual-execution HLD V1 (Stage 3b.1): opt-in surface for test-only
# panic-injection APIs arriving with Stage 3b.4. Mirrors the RP2350
# `testing` feature; NOT in `default` on purpose.
testing = []

[dependencies]
picoem-common = { version = "0.2", path = "../picoem-common" }
picoem-devices = { version = "0.1", path = "../picoem-devices" }
tracing = { workspace = true }

[dev-dependencies]
picoem-common = { path = "../picoem-common", features = ["test-hooks"] }

# Dual-execution HLD V1 (Stage 3b.1): integration-test file registrations
# land now so later sub-stages can add tests without editing Cargo.toml.
# The files don't exist yet — Cargo only complains when the test is
# actually requested (`cargo test --test execution_model`).
[[test]]
name = "execution_model"
required-features = ["threading", "testing"]

[[test]]
name = "dual_model"
required-features = ["threading"]

# docs.rs builds on Linux x86_64. Enable all opt-in features so the
# rendered API surface includes the threaded runtime (`x86_64`-Linux is
# one of the two supported platforms for `ThreadedEmulator`) plus the
# test-only hooks that integration tests reference.
[package.metadata.docs.rs]
features = ["threading", "testing", "test-hooks"]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
