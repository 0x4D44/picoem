[package]
name = "mdrp2350"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Forward the PIO `test-hooks` feature to `mdpicoem-common`. Enables
# cross-crate unit tests to push RX FIFO words via `PioBlock::push_rx`.
test-hooks = ["mdpicoem-common/test-hooks"]

[dependencies]
mdpicoem-common = { path = "../mdpicoem-common" }
